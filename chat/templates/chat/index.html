<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemini Chatbot</title>
    <style>
        :root {
            --bg: #0e1117;
            --side: #171b24;
            --card: #1f2430;
            --text: #e6e8ee;
            --muted: #9aa3b2;
            --accent: #ff6b35;
            --border: #2b3140;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        }

        aside {
            width: 280px;
            background: var(--side);
            padding: 20px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        aside h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        label {
            font-size: 13px;
            color: var(--muted);
        }

        select,
        textarea,
        input {
            width: 100%;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            border-color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        header {
            width: 100%;
            max-width: 820px;
            padding: 24px 20px 8px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        #chat {
            flex: 1;
            width: 100%;
            max-width: 820px;
            overflow-y: auto;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.55;
            max-width: 85%;
            word-wrap: break-word;
        }

        .msg.user {
            background: var(--card);
            align-self: flex-end;
            border: 1px solid var(--border);
        }

        .msg.assistant {
            background: transparent;
            align-self: flex-start;
        }

        .msg.error {
            background: #5a2328;
            color: #ffb4b4;
            align-self: flex-start;
        }

        .msg.thinking {
            color: var(--muted);
            font-style: italic;
        }

        #composer {
            width: 100%;
            max-width: 820px;
            padding: 12px 20px 24px;
            display: flex;
            gap: 10px;
        }

        #composer input {
            flex: 1;
        }

        #send {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        @media (max-width:760px) {
            aside {
                display: none;
            }
        }
    </style>
</head>

<body>
    {% csrf_token %}
    <aside>
        <h2>Settings</h2>
        <label for="model">Model</label>
        <select id="model">
            {% for m in models %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
        </select>
        <label for="sys">System prompt</label>
        <textarea id="sys">{{ default_system_prompt }}</textarea>
        <button id="clear">🗑️ Clear chat</button>
    </aside>

    <main>
        <header>
            <h1>🤖 Gemini Chatbot</h1>
            <p>Built with LangChain + Django</p>
            {% if not has_key %}<p style="color:#ffb4b4">API key missing: add GEM=your_key to .env and restart the
                server.</p>{% endif %}
        </header>
        <div id="chat"></div>
        <div id="composer">
            <input id="input" placeholder="Type your message..." autocomplete="off" autofocus>
            <button id="send">Send</button>
        </div>
    </main>

    {{ history|json_script:"history-data" }}
    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;

        function add(role, text) {
            const d = document.createElement("div");
            d.className = "msg " + role;
            d.textContent = text;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
            return d;
        }

        async function post(url, body) {
            const r = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
                body: JSON.stringify(body || {}),
            });
            return { ok: r.ok, data: await r.json() };
        }

        JSON.parse(document.getElementById("history-data").textContent)
            .forEach(m => add(m.role, m.content));

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            sendBtn.disabled = input.disabled = true;
            add("user", text);
            const pending = add("assistant thinking", "Thinking...");
            try {
                const { ok, data } = await post("/api/chat/", {
                    message: text,
                    model: document.getElementById("model").value,
                    system_prompt: document.getElementById("sys").value,
                });
                if (ok) { pending.className = "msg assistant"; pending.textContent = data.reply; }
                else { pending.className = "msg error"; pending.textContent = "Error: " + data.error; }
            } catch (e) {
                pending.className = "msg error"; pending.textContent = "Error: " + e;
            }
            sendBtn.disabled = input.disabled = false;
            input.focus();
            chat.scrollTop = chat.scrollHeight;
        }

        sendBtn.onclick = send;
        input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
        document.getElementById("clear").onclick = async () => {
            await post("/api/clear/");
            chat.innerHTML = "";
        };
    </script>
</body>

</html>
